# Portal Director settings. Most of these are changed in-game with /pd commands (/pd settings, /pd set <name> <value>)
# and saved here automatically. Edit while the server is stopped, or use /pd reload.
#
# generate.radius: how far portals may be from the center to the north, south, east and west. An automatic 5% is added
#   on every side (radius 100 allows 105). Whole obsidian frames stay inside.
# generate.altitude-min / altitude-max: how many blocks ABOVE THE GROUND floating portals hang.
# generate.world-y-min / world-y-max: the lowest and highest real Minecraft Y any portal frame may use (a safety limit).
# generate.facing: north, south, east, west or random; the square layout uses inward or outward.
# generate.placement: ground, air or mixed (mixed builds about half floating and half ground portals).
# generate.spacing-horizontal: least gap between frames across the ground (x/z). spacing-vertical: least gap between floating portals above each other.
# tnt.protect-terrain: explosions hurt entities but destroy no blocks. tnt.fuse-seconds: 0 means minecarts explode only when they crash.
# TNT minecarts are never launched unless an admin runs /pd tnt launch or /pd tnt wave.
generate:
  count: 30
  radius: 100
  spacing-horizontal: 8
  spacing-vertical: 5
  placement: mixed
  altitude-min: 15
  altitude-max: 60
  world-y-min: -64
  world-y-max: 320
  layout: random
  facing: random
  blocks-per-tick: 400
  max-chunks: 900
  max-portals: 500
tnt:
  per-portal: 1
  speed: 1.3
  lift: 0.25
  waves: 1
  wave-delay-ticks: 100
  stagger-ticks: 0
  interval-ticks: 4
  preview: false
  protect-terrain: true
  protect-portals: true
  max-active: 300
  lifetime-seconds: 60
  spawns-per-tick: 60
  fuse-seconds: 3.0
