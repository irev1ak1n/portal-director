name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4.4.1

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4.4.1

      - name: Build and run the unit tests
        run: ./gradlew build --console=plain

      - name: Build the jar a second time and compare
        run: |
          sha256sum build/libs/*.jar > first.sha
          ./gradlew clean jar --console=plain
          sha256sum -c first.sha

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Keep the jar
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PortalDirector-jar
          path: build/libs/*.jar
